name: Update GitHub Stats

on:
  # Update every hour
  schedule:
    - cron: "0 * * * *"

  # Allow manual update
  workflow_dispatch:

  # Run when you manually update README/workflow
  # Prevents the bot's generated SVG commit from triggering itself again
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

# Prevent multiple stats workflows from pushing at the same time
concurrency:
  group: github-stats-update
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================
      # Generate GitHub Stats
      # ==========================================
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=adityasingh475&show_icons=true&include_all_commits=true&count_private=true&bg_color=0B1020&title_color=00E5FF&icon_color=7C3AED&text_color=E6EDF3&ring_color=00E5FF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Generate GitHub Streak
      # ==========================================
      - name: Generate GitHub Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=adityasingh475&background=0B1020&ring=00E5FF&fire=7C3AED&currStreakLabel=00E5FF&sideLabels=E6EDF3&currStreakNum=E6EDF3&sideNums=E6EDF3&dates=8B949E&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Commit updated stats
      # ==========================================
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/streak.svg

          if git diff --cached --quiet; then
            echo "No stats changes detected"
            exit 0
          fi

          git commit -m "Update GitHub stats"

          # Get the latest remote changes
          git fetch origin main

          # Rebase our stats commit on top of latest main
          git rebase origin/main

          # Push updated stats
          git push origin HEAD:main
