name: Update GitHub Stats

on:
  # Update automatically every hour
  schedule:
    - cron: "0 * * * *"

  # Allow manual update from GitHub Actions
  workflow_dispatch:

  # Update when repository changes
  push:
    branches:
      - main

# Prevent multiple stats workflows from running at the same time
concurrency:
  group: github-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout profile repository
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================================
      # Generate GitHub Stats Card
      # =====================================================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=adityasingh475&show_icons=true&include_all_commits=true&count_private=true&bg_color=0B1020&title_color=00E5FF&icon_color=7C3AED&text_color=E6EDF3&ring_color=00E5FF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # Generate GitHub Streak Card
      # =====================================================

      - name: Generate GitHub Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=adityasingh475&background=0B1020&ring=00E5FF&fire=7C3AED&currStreakLabel=00E5FF&sideLabels=E6EDF3&currStreakNum=E6EDF3&sideNums=E6EDF3&dates=8B949E&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # Save generated files
      # =====================================================

      - name: Save generated stats
        run: |
          cp profile/stats.svg /tmp/stats.svg
          cp profile/streak.svg /tmp/streak.svg

      # =====================================================
      # Update repository safely
      # =====================================================

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/stats.svg profile/stats.svg
            cp /tmp/streak.svg profile/streak.svg

            git add profile/stats.svg profile/streak.svg

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Update GitHub stats"

            if git push origin HEAD:main; then
              echo "Stats updated successfully"
              exit 0
            fi

            echo "Push failed. Retrying..."
            git reset --hard origin/main
            sleep 5
          done

          echo "Failed to push after 3 attempts"
          exit 1
